services:
  relay-postgres:
    image: postgres:17-alpine
    container_name: relay-postgres
    env_file: ./container/.env.${ENV:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - relay-network
    volumes:
      - relay-postgres-data:/var/lib/postgresql/data
      - ./container/scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
