services:
  relay-redis:
    image: redis:8.8.2-alpine
    container_name: relay-redis
    restart: unless-stopped
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:-relay}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - relay-network
    volumes:
      - relay-queues-data:/data
      - ./container/configs/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
